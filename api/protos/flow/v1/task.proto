syntax = "proto3";

package flow.v1;

option go_package = "github.com/tx7do/go-wind-flow/api/gen/go/flow/v1;flowv1";

import "flow/v1/instance.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";

// 用户任务服务：办结（会签/或签/驳回语义由定义驱动）、转办、加签、退回、待办查询。
service FlowTaskService {
  // 办结任务（驳回按定义的 RejectMode：TERMINATE 终结实例 / STAY 停留）
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse) {}

  // 转办：把待办任务移交他人
  rpc ForwardTask(ForwardTaskRequest) returns (FlowTask) {}

  // 认领候选组任务（组内成员，经 IdentityProvider 鉴权）
  rpc ClaimTask(ClaimTaskRequest) returns (FlowTask) {}

  // 退认：放回待认领池
  rpc UnclaimTask(UnclaimTaskRequest) returns (FlowTask) {}

  // 查询用户可认领的组待办
  rpc ListCandidateTasks(ListCandidateTasksRequest) returns (ListTasksResponse) {}

  // 加签：向待办任务所在节点动态追加办理人（会签式，ALL/ANY 语义照常）
  rpc AddSigners(AddSignersRequest) returns (ListTasksResponse) {}

  // 退回指定节点：实例退回到更早的 userTask 重走（待办取消、历史保留）
  rpc ReturnTo(ReturnToRequest) returns (CompleteTaskResponse) {}

  // 查询任务详情
  rpc GetTask(GetTaskRequest) returns (FlowTask) {}

  // 查询用户待办
  rpc ListPendingTasks(ListPendingTasksRequest) returns (ListTasksResponse) {}

  // 查询实例下全部任务（含已办结）
  rpc ListInstanceTasks(ListInstanceTasksRequest) returns (ListTasksResponse) {}

  // 到期任务扫描（宿主 cron 驱动；到期任务广播 task.due 监听器事件）
  rpc CheckDueTasks(CheckDueTasksRequest) returns (ListTasksResponse) {}
}

// 任务状态。
enum FlowTaskStatus {
  FLOW_TASK_STATUS_UNSPECIFIED = 0;
  // 待办理
  FLOW_TASK_STATUS_PENDING = 1;
  // 已通过
  FLOW_TASK_STATUS_APPROVED = 2;
  // 已驳回
  FLOW_TASK_STATUS_REJECTED = 3;
  // 已取消（或签命中/实例终结）
  FLOW_TASK_STATUS_CANCELLED = 4;
  // 已转办
  FLOW_TASK_STATUS_FORWARDED = 5;
}

// 办结动作。
enum FlowTaskOutcome {
  FLOW_TASK_OUTCOME_UNSPECIFIED = 0;
  // 通过
  FLOW_TASK_OUTCOME_APPROVE = 1;
  // 驳回
  FLOW_TASK_OUTCOME_REJECT = 2;
}

// 用户任务。
message FlowTask {
  string id = 1;
  string instance_id = 2;
  string tenant_id = 3;
  string node_id = 4;
  string token_id = 5;
  string name = 6;
  string assignee = 7;
  // 候选组（待认领任务的组编码集合）
  repeated string candidate_groups = 14;
  FlowTaskStatus status = 8;
  // 办结动作（APPROVE/REJECT，办结后回填）
  string outcome = 9;
  string comment = 10;
  // 超时时刻（定义带 timer 时由引擎打标）
  optional google.protobuf.Timestamp due_at = 11;
  google.protobuf.Timestamp created_at = 12;
  optional google.protobuf.Timestamp ended_at = 13;
}

message CompleteTaskRequest {
  string task_id = 1 ;
  // 操作者（必须是办理人）
  string actor_id = 2 ;
  FlowTaskOutcome outcome = 3 ;
  string comment = 4;
  // 办结时回写的业务变量（如审批表单字段），进实例级
  google.protobuf.Struct variables = 5;
  // 办结时写入令牌级局部变量（仅当前分支后续节点可读，不进业务数据）
  optional google.protobuf.Struct local_variables = 6;
}

message CompleteTaskResponse {
  // 办结后的实例（可能已终结）
  FlowInstance instance = 1;
}

message ForwardTaskRequest {
  string task_id = 1 ;
  // 操作者（必须是当前办理人；服务端调用可留空）
  string actor_id = 2;
  // 移交目标用户
  string to_user_id = 3 ;
}

message GetTaskRequest {
  string id = 1 ;
}

message ListPendingTasksRequest {
  string tenant_id = 1;
  string assignee = 2;
  pagination.PagingRequest paging = 3;
}

message ClaimTaskRequest {
  string task_id = 1 ;
  // 认领人（须属于任务候选组）
  string user_id = 2 ;
}

message UnclaimTaskRequest {
  string task_id = 1 ;
  // 操作者（须为当前认领人）
  string actor_id = 2 ;
}

message ListCandidateTasksRequest {
  string tenant_id = 1;
  string user_id = 2;
  pagination.PagingRequest paging = 3;
}

message ListInstanceTasksRequest {
  string instance_id = 1 ;
}

message CheckDueTasksRequest {
  // 判定时刻（缺省 = 服务端当前时间）
  optional google.protobuf.Timestamp as_of = 1;
}

message AddSignersRequest {
  // 锚点待办任务（同节点的任意一个待办）
  string task_id = 1 ;
  // 操作者（通常是发起加签的办理人）
  string actor_id = 2;
  // 追加的办理人（已是该节点待办办理人的自动去重；委托叠加后落任务）
  repeated string user_ids = 3 ;
}

message ReturnToRequest {
  // 锚点待办任务（所在实例退回）
  string task_id = 1 ;
  // 操作者
  string actor_id = 2;
  // 退回目标节点（必须是当前节点的 userTask 祖先；在途并行分支时拒绝）
  string target_node_id = 3 ;
  string comment = 4;
}

message ListTasksResponse {
  repeated FlowTask items = 1;
  int64 total = 2;
}
