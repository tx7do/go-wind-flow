# go-wind-flow API 生成配置。
# 域契约保持纯 gRPC（HTTP 路由由宿主 BFF 层定义——家族惯例）。
# 生成：buf generate    （依赖更新：buf dep update）
version: v2

clean: true

plugins:
  # Go 消息
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative

  # gRPC 服务桩
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
